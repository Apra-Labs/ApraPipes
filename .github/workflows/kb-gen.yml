name: KB Generation

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Scan depth (shallow or deep)'
        required: true
        default: 'deep'
        type: choice
        options:
          - shallow
          - deep
      budget:
        description: 'Budget cap in USD'
        required: true
        default: '15'
        type: string
      promote:
        description: 'Auto-promote entries to CONFIRMED'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  kb-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude setup-token ${{ secrets.CLAUDE_SETUP_TOKEN }}

      - name: Install apra-fleet
        run: |
          npm install -g @apralabs/apra-fleet
          apra-fleet install

      - name: Install kb-gen workflow from repo
        run: |
          mkdir -p ~/.apra-fleet/workflows/kb-gen
          cp .fleet/workflows/kb-gen/* ~/.apra-fleet/workflows/kb-gen/

      - name: Start fleet server
        run: |
          apra-fleet run &
          sleep 5
          curl -sf http://localhost:7523/health || (echo "Fleet server failed to start" && exit 1)

      - name: Register CI member
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          # Register a local member pointing to the checkout
          node -e "
            const { connectFleet } = require('@apralabs/apra-fleet-client/server-resolution');
            (async () => {
              const { mcpClient } = await connectFleet({ env: process.env });
              const result = await mcpClient.callTool('register_member', {
                name: 'ci-scanner',
                work_folder: '${{ github.workspace }}',
                type: 'local'
              });
              console.log('Registered:', JSON.stringify(result));
              process.exit(0);
            })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Run kb-gen workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          PROMOTE_FLAG=""
          if [ "${{ inputs.promote }}" = "false" ]; then
            PROMOTE_FLAG="--no-promote"
          fi

          apra-fleet workflow kb-gen \
            --member ci-scanner \
            --depth ${{ inputs.depth }} \
            --budget ${{ inputs.budget }} \
            $PROMOTE_FLAG

      - name: Show KB stats
        run: |
          node -e "
            const { connectFleet } = require('@apralabs/apra-fleet-client/server-resolution');
            (async () => {
              const { mcpClient } = await connectFleet({ env: process.env });
              const result = await mcpClient.callTool('kb_stats', {
                repo: '${{ github.workspace }}'
              });
              console.log(JSON.stringify(JSON.parse(result.content[0].text), null, 2));
              process.exit(0);
            })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Commit and push KB bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the bible if it was generated
          if [ -f ".fleet/kb-canonical.json" ]; then
            git add .fleet/kb-canonical.json
            git diff --cached --quiet || git commit -m "chore(kb): update canonical bible [skip ci]"
            git push origin HEAD
          else
            echo "No bible generated (no CONFIRMED entries?)"
          fi
